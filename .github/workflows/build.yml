name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20 # إصدار مستقر ومتوافق سحابياً

      - name: Fix Node Packages Clean Build
        run: |
          npm install -g bun
          bun install --no-frozen-lockfile

      - name: Build and Export Android App
        run: |
          npx expo export --platform android
