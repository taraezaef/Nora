name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Fix Bun Framework Dependency
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clean Install App Packages
        run: |
          npm install -g bun
          bun install --no-frozen-lockfile

      - name: Build and Export Android App
        run: |
          npx expo export --platform android
